{% extends "base.html" %}

{% block title %}Create Account — AI Placement Portal{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <h1 class="auth-title">Create Account</h1>
    <p class="auth-desc">Register to begin practicing AI diagnostic interview assessments.</p>

    <div id="authAlert" class="alert-box alert-danger"></div>

    <form id="registerForm" method="POST" action="{{ url_for('auth.register_api') }}">
      <div class="form-group">
        <label for="name" class="form-label">Full Name</label>
        <input 
          type="text" 
          id="name" 
          name="name" 
          class="form-control" 
          placeholder="e.g. Alex Johnson" 
          required 
          autocomplete="name"
        >
      </div>

      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          class="form-control" 
          placeholder="name@domain.com" 
          required 
          autocomplete="email"
        >
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          class="form-control" 
          placeholder="••••••••" 
          required 
          minlength="6"
          autocomplete="new-password"
        >
      </div>

      <div class="form-group">
        <label for="confirm_password" class="form-label">Confirm Password</label>
        <input 
          type="password" 
          id="confirm_password" 
          name="confirm_password" 
          class="form-control" 
          placeholder="••••••••" 
          required 
          minlength="6"
          autocomplete="new-password"
        >
      </div>

      <button type="submit" id="submitBtn" class="btn btn-primary btn-full">
        <span>Create Account →</span>
      </button>
    </form>

    <div class="auth-footer">
      <span>Already have an account?</span>
      <a href="{{ url_for('auth.login_page') }}" class="auth-link">Sign in</a>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}
